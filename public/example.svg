<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040"><rect width="800" height="1040" fill="#fffefa"/><g stroke="#dfe5d9"><path d="M80 280H728M80 327H728M80 374H728M80 421H728M80 468H728M80 515H728M80 562H728M80 609H728M80 656H728M80 703H728M80 750H728M80 797H728M80 844H728M80 891H728"/></g><text x="96" y="76" font-family="sans-serif" font-size="17" fill="#7c8776">서평 고쳐쓰기 · 체험용 예시</text><text x="120" y="155" font-family="sans-serif" font-weight="700" font-size="30" fill="#33422b">함께 지킨 작은 생명</text><g font-family="sans-serif" font-size="24" fill="#424a3d"><text x="96" y="272">『호랑이를 부탁해』는 달걀을 부화시키는</text><text x="96" y="319">아이들의 이야기를 담은 동화이다.</text><text x="96" y="413">아이들은 깨진 달걀을 발견하고 슬퍼한다.</text><text x="96" y="460">함께 남은 달걀을 지켜 병아리를 부화시킨다.</text><text x="96" y="554">아이들이 서로 용서하는 장면이 감동적이었다.</text><text x="96" y="648">이 책은 친구의 마음을 생각하게 해 준다.</text><text x="96" y="695">나는 친구들과 함께 이 책을 읽고 싶다.</text><text x="96" y="742">나도 친구에게 먼저 사과해도 됄 것 같다.</text></g><text x="96" y="976" fill="#88917f" font-family="sans-serif" font-size="15">사용 방법을 살펴보기 위한 가상의 학생 글입니다.</text></svg>
